spring.application.name=loja

# servidor
server.port=8080

# banco de dados H2 gravado na pasta "dados" do projeto
spring.datasource.url=jdbc:h2:file:./dados/loja
spring.datasource.username=sa
spring.datasource.password=

# JPA: cria e atualiza as tabelas a partir das entidades
spring.jpa.hibernate.ddl-auto=update
spring.jpa.open-in-view=false
# mostra no console o SQL gerado (útil para aprender; desligue em produção)
spring.jpa.show-sql=true

# idioma fixo: números, moedas e mensagens no formato brasileiro
spring.web.locale=pt_BR
spring.web.locale-resolver=fixed

# upload: tamanho máximo de cada arquivo e da requisição inteira
spring.servlet.multipart.max-file-size=10MB
spring.servlet.multipart.max-request-size=30MB
