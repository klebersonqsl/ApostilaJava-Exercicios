<!DOCTYPE html>
<html lang="pt-BR" xmlns:th="http://www.thymeleaf.org">
<!-- usada para qualquer erro 500 a 599; o detalhe fica só no log do servidor -->
<head th:replace="~{fragmentos :: head('Erro no servidor')}"></head>
<body>
<header th:replace="~{fragmentos :: cabecalho}"></header>
<main>
    <h2>Erro no servidor</h2>
    <p class="erro">Desculpe, ocorreu um erro inesperado. A equipe foi avisada.</p>
    <a class="botao" th:href="@{/produtos}">Voltar aos produtos</a>
</main>
<footer th:replace="~{fragmentos :: rodape}"></footer>
</body>
</html>
