<!DOCTYPE html>
<html lang="pt-BR"
      xmlns:h="jakarta.faces.html"
      xmlns:ui="jakarta.faces.facelets">
<!-- páginas que leem parâmetros da URL definem aqui o seu f:metadata -->
<ui:insert name="metadados"/>
<h:head>
    <title><ui:insert name="titulo"/> - Loja do Curso</title>
    <h:outputStylesheet name="css/estilo.css"/>
</h:head>
<h:body>
    <header>
        <h1 style="display:inline">Loja do Curso</h1>
        <nav>
            <h:link outcome="produtos" value="Produtos"/>
            <h:link outcome="documentos" value="Documentos"/>
        </nav>
    </header>
    <main>
        <h2><ui:insert name="titulo"/></h2>
        <!-- mensagens gerais (sem campo associado); id fixo para o ajax atualizar -->
        <h:panelGroup id="avisos" layout="block">
            <h:messages globalOnly="true" styleClass="avisos"
                        infoClass="ok" errorClass="erro"/>
        </h:panelGroup>
        <ui:insert name="conteudo"/>
    </main>
    <footer style="text-align:center; color:#777; font-size:13px; margin-bottom:20px">
        Loja do Curso &#183; Jakarta Faces e MVC
    </footer>
</h:body>
</html>
